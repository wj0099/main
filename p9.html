<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문정희 겨울일기 수행평가</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Pretendard', sans-serif;
}

body{
overflow:auto;
background:#f4f7fb;
color:#1e293b;
}

.snow{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
pointer-events:none;
z-index:0;
}

.snow span{
position:absolute;
top:-10px;
width:6px;
height:6px;
background:white;
border-radius:50%;
opacity:0.8;
animation:snow linear infinite;
}

@keyframes snow{
to{
transform:translateY(110vh);
}
}

.slide{
width:100vw;
min-height:100vh;
padding:60px;
display:none;
flex-direction:column;
justify-content:flex-start;
position:relative;
z-index:2;

background:
linear-gradient(
rgba(255,255,255,0.92),
rgba(255,255,255,0.94)
),

url('https://images.unsplash.com/photo-1511131341194-24e2eeeebb09?q=80&w=1974&auto=format&fit=crop');

background-size:cover;
background-position:center;
overflow-y:auto;
}

.slide.active{
display:flex;
animation:fade 0.6s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}
}

h1{
font-size:62px;
margin-bottom:20px;
color:#0f172a;
}

h2{
font-size:40px;
margin-bottom:30px;
padding-bottom:12px;
border-bottom:3px solid #cbd5e1;
color:#1e293b;
}

h3{
font-size:27px;
margin-top:24px;
margin-bottom:12px;
color:#334155;
}

p{
font-size:21px;
line-height:2;
margin-bottom:18px;
}

li{
font-size:21px;
line-height:2;
margin-bottom:8px;
}

ul{
margin-left:30px;
}

.quote{
background:rgba(255,255,255,0.78);
padding:28px;
border-radius:18px;
line-height:2.1;
font-size:21px;
white-space:pre-line;
box-shadow:0 4px 14px rgba(0,0,0,0.08);
margin-top:20px;
margin-bottom:24px;
}

.center{
justify-content:center;
align-items:center;
text-align:center;
}

.analysis-wrap{
display:flex;
gap:30px;
align-items:flex-start;
margin-top:15px;
}

.poem-box{
width:48%;
background:rgba(255,255,255,0.85);
padding:28px;
border-radius:18px;
line-height:2.3;
font-size:22px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.note-box{
width:52%;
background:rgba(255,255,255,0.82);
padding:28px;
border-radius:18px;
line-height:2;
font-size:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.highlight-red{
background:linear-gradient(
transparent 60%,
rgba(255,120,120,0.45) 60%
);
}

.highlight-blue{
background:linear-gradient(
transparent 60%,
rgba(120,170,255,0.45) 60%
);
}

.memo{
color:#dc2626;
font-weight:bold;
font-size:18px;
margin-top:6px;
margin-bottom:12px;
line-height:1.8;
}

.arrow{
font-size:18px;
color:#2563eb;
margin-top:6px;
margin-bottom:10px;
line-height:1.8;
}

.table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:rgba(255,255,255,0.78);
}

.table td,
.table th{
border:1px solid #cbd5e1;
padding:15px;
font-size:20px;
line-height:1.8;
}

.nav{
position:fixed;
right:25px;
bottom:25px;
display:flex;
gap:10px;
z-index:20;
}

button{
padding:14px 22px;
border:none;
border-radius:12px;
background:#dbe4f0;
font-size:17px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#cbd5e1;
}

.small{
font-size:17px;
color:#64748b;
line-height:1.8;
margin-top:6px;
}

</style>
</head>

<body>

<div class="snow" id="snow"></div>

<!-- 표지 -->

<section class="slide active center">

<h1>문정희 「겨울일기」</h1>

<p style="font-size:30px;">
문학 작품 분석 및 재구성 발표
</p>

<p class="small">
겨울이라는 계절 속에 담긴 인간의 상실과 고독
</p>

<p style="
margin-top:28px;
font-size:22px;
letter-spacing:1px;
color:#475569;
font-weight:500;
">
20112 남우진
</p>

</section>

<!-- 이하 나머지 코드는 이전 완성본과 동일 -->
